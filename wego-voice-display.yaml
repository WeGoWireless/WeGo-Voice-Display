sensor:
  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(current_page) == 0;'
            then:
              - component.update: main_display
  - platform: homeassistant
    id: furnace_current_temperature
    entity_id: ${thermostat_1_entity}
    attribute: current_temperature
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(current_page) == 2 || id(current_page) == 3;'
            then:
              - component.update: main_display
  - platform: homeassistant
    id: pellet_current_temperature
    entity_id: ${thermostat_2_entity}
    attribute: current_temperature
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(current_page) == 2 || id(current_page) == 4;'
            then:
              - component.update: main_display
  - platform: homeassistant
    id: furnace_target_temperature
    entity_id: ${thermostat_1_entity}
    attribute: temperature

    on_value:
      then:
        - lambda: |-
            // Check whether Home Assistant confirmed our setpoint.
            if (id(furnace_temperature_pending) &&
                !isnan(id(furnace_pending_temperature)) &&
                fabsf(x - id(furnace_pending_temperature)) < 0.1f) {

              id(furnace_temperature_pending) = false;

              ESP_LOGI("climate",
                       "Furnace setpoint confirmed by Home Assistant: %.0f",
                       x);
            }
        - if:
            condition:
              lambda: 'return id(current_page) == 2 || id(current_page) == 3;'
            then:
              - component.update: main_display
  - platform: homeassistant
    id: pellet_target_temperature
    entity_id: ${thermostat_2_entity}
    attribute: temperature

    on_value:
      then:
        - lambda: |-
            // Check whether Home Assistant confirmed our setpoint.
            if (id(pellet_temperature_pending) &&
                !isnan(id(pellet_pending_temperature)) &&
                fabsf(x - id(pellet_pending_temperature)) < 0.1f) {

              id(pellet_temperature_pending) = false;

              ESP_LOGI("climate",
                       "Pellet Stove setpoint confirmed by Home Assistant: %.0f",
                       x);
            }
    
        - if:
            condition:
              lambda: 'return id(current_page) == 2 || id(current_page) == 4;'
            then:
              - component.update: main_display
  - platform: homeassistant
    id: solarroom_current_temperature
    entity_id: ${thermostat_3_entity}
    attribute: current_temperature
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(current_page) == 2 || id(current_page) == 5;'
            then:
              - component.update: main_display
  - platform: homeassistant
    id: solarroom_target_temperature
    entity_id: ${thermostat_3_entity}
    attribute: temperature
    on_value:
      then:
        - lambda: |-
            if (id(solarroom_temperature_pending) &&
                fabsf(x - id(solarroom_pending_temperature)) < 0.1f) {
              id(solarroom_temperature_pending) = false;
            }
        - if:
            condition:
              lambda: 'return id(current_page) == 2 || id(current_page) == 5;'
            then:
              - component.update: main_display
  - platform: homeassistant
    id: sunroom_current_temperature
    entity_id: ${thermostat_4_entity}
    attribute: current_temperature
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(current_page) == 2 || id(current_page) == 6;'

# ============================================================================
# WeGo Voice Display — public configuration template (based on validated V5)
# Hardware: Waveshare ESP32-S3-Touch-LCD-4.3 (800 x 480)
# ============================================================================
# QUICK START — CHANGE ONLY THE VALUES IN THE substitutions: BLOCK BELOW
#
# 1. Set thermostat_count to the number of climate devices you want to show
#    (0 through 4). Set light_count to the number of lights/switches (0 through 8).
# 2. For each USED thermostat slot, enter a friendly display name and the
#    corresponding Home Assistant climate.* entity ID.
# 3. For each USED light slot, enter a friendly display name and a Home
#    Assistant light.* OR switch.* entity ID.
# 4. Set weather_entity to your Home Assistant weather.* entity ID.
# 5. Set the ESPHome device name and friendly name in esphome: below if desired.
# 6. Keep the images/ folder alongside this YAML; the built-in graphics need it.
# 7. Validate in ESPHome Device Builder, then install on your display.
#
# EXAMPLE: For 2 thermostats and 1 light, use thermostat_count: "2" and
# light_count: "1"; fill in thermostat_1/2 and light_1 only.
#
# PUBLIC TEMPLATE: The entity IDs below are examples, NOT working devices.
# Replace every USED entity ID with the matching ID from your Home Assistant.
# The default example displays four thermostats and two lights/switches.
# Change the counts to match your home. Keep the unused slot placeholders.
#
# UNUSED SLOTS: Leave the placeholders unchanged. Unused devices are hidden
# from the UI and do not respond to touch. ESPHome still creates harmless
# Home Assistant subscriptions for these slots; counts do NOT remove them
# from the firmware. Keep counts as quoted strings (for substitutions).
#
# WALLPAPER: The online image has a placeholder URL below. Configure your
# wallpaper URL using the device's Home Assistant controls; do not publish
# a private image server URL in a public repository.
# BACKLIGHT: Always On, Manual, Schedule, and Sunrise/Sunset settings are
# available from the device's existing Home Assistant controls.
#
# ADVANCED: Everything after this setup section preserves the V4 logic.
# Do not change the rendering, touch handlers, or thermostat debounce unless
# you intend to modify functionality. Keep V4 as a known-good backup.
# ============================================================================
substitutions:
  # ------------------- REQUIRED DEVICE COUNTS -------------------
  thermostat_count: "4"  # 0–4 climate devices displayed
  light_count: "2"       # 0–8 light/switch devices displayed

  # ------------------- WEATHER -------------------
  weather_entity: "weather.openweathermap"  # CHANGE to your weather.* ID

  # ------------------- THERMOSTATS -------------------
  # Fill slots consecutively from 1. Only the first thermostat_count show.
  # All thermostat entity IDs must use the climate.* domain.
  thermostat_1_name: "Living Room"
  thermostat_1_entity: "climate.living_room"
  thermostat_2_name: "Bedroom"
  thermostat_2_entity: "climate.bedroom"
  thermostat_3_name: "Office"
  thermostat_3_entity: "climate.office"
  thermostat_4_name: "Guest Room"
  thermostat_4_entity: "climate.guest_room"

  # ------------------- LIGHTS AND SWITCHES -------------------
  # Fill slots consecutively from 1. Only the first light_count show.
  # Both light.* and switch.* entity IDs are supported.
  light_1_name: "Bedside Lamp"
  light_1_entity: "light.bedside_lamp"
  light_2_name: "Desk Lamp"
  light_2_entity: "switch.desk_lamp"

  # ------------------- UNUSED LIGHT SLOTS -------------------
  # Safe placeholders. Leave unchanged unless increasing light_count.
  light_3_name: "Light 3"
  light_3_entity: "light.wego_unused_slot_3"
  light_4_name: "Light 4"
  light_4_entity: "light.wego_unused_slot_4"
  light_5_name: "Light 5"
  light_5_entity: "light.wego_unused_slot_5"
  light_6_name: "Light 6"
  light_6_entity: "light.wego_unused_slot_6"
  light_7_name: "Light 7"
  light_7_entity: "light.wego_unused_slot_7"
  light_8_name: "Light 8"
  light_8_entity: "light.wego_unused_slot_8"

# ============================================================================
# ADVANCED CONFIGURATION — validated V5 firmware behavior unchanged below this line.
# ============================================================================

# Board: Espressif ESP32-S3-DevKitC-1-N16R8V (16 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n16r8/manifest.yaml
   
esphome:
  name: wego-voice-display
  friendly_name: WeGo Voice Display

  on_boot:
    priority: -100
    then:
      - delay: 1s
      - component.update: main_display
      - script.execute: apply_backlight_schedule
      - delay: 29s
      - script.execute: load_daily_wallpaper
  
esp32:
  variant: esp32s3
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

ch422g:
  - id: ch422g_hub

globals:
  - id: backlight_mode_value
    type: int
    restore_value: yes
    initial_value: '0'  # 0 Always On, 1 Manual, 2 Schedule, 3 Sunrise/Sunset
  - id: backlight_temporary_wake
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wallpaper_custom_mode
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: online_background_loaded
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'
  # ============================================================
  # Thermostat pending setpoints
  # ============================================================
  - id: furnace_pending_temperature
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: pellet_pending_temperature
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: furnace_temperature_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: pellet_temperature_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: solarroom_pending_temperature
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: solarroom_temperature_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: solarroom_pending_hvac_mode
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: solarroom_hvac_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: sunroom_pending_temperature
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: sunroom_temperature_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sunroom_pending_hvac_mode
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: sunroom_hvac_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: solarroom_pending_fan_mode
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: solarroom_fan_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: sunroom_pending_fan_mode
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: sunroom_fan_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: thermostat_button_pressed
    type: bool
    restore_value: no
    initial_value: 'false'
    
  # ============================================================
  # Furnace operating mode and fan mode
  # ============================================================
  - id: furnace_pending_hvac_mode
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: furnace_hvac_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: furnace_pending_fan_mode
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: furnace_fan_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  # ============================================================
  # Pellet Stove operating mode and fan mode
  # ============================================================
  - id: pellet_pending_hvac_mode
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pellet_hvac_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: pellet_pending_fan_mode
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pellet_fan_mode_pending
    type: bool
    restore_value: no
    initial_value: 'false'
    
http_request:

online_image:
  - url: "https://example.com/wallpaper.jpg"
    id: online_background
    format: JPEG
    type: RGB565
    resize: 800x480

    on_download_finished:
      then:
        - lambda: |-
            id(online_background_loaded) = true;
            ESP_LOGI("wallpaper", "Wallpaper downloaded successfully");
        - if:
            condition:
              lambda: 'return id(current_page) == 0;'
            then:
              - component.update: main_display

    on_error:
      then:
        - lambda: |-
            id(online_background_loaded) = false;
            ESP_LOGW("wallpaper", "Wallpaper download failed - using built-in background");
        - if:
            condition:
              lambda: 'return id(current_page) == 0;'
            then:
              - component.update: main_display


